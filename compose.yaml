services:
  server:
    image: ghcr.io/sohosai/ultradonguri-server:production
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Tokyo
    networks:
      - app-network

  client:
    image: ghcr.io/sohosai/ultradonguri-controller:production
    restart: unless-stopped
    ports:
      - "5173:5173"
    networks:
      - app-network

networks:
  app-network:
