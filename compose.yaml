services:
  server:
    image: ghcr.io/sohosai/ultradonguri-server:production
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: "${TZ:-Asia/Tokyo}"
      # OBS WebSocket Address and Password (MUST)
      ADDRESS: "${ADDRESS:-host.docker.internal:4455}"
      # OBS WebSocket Password (MUST)
      PASSWORD: "${PASSWORD:?PASSWORD is required}"
      NORMAL_SCENE_NAME: "${NORMAL_SCENE_NAME:-Normal_Scene}"
      CM_SCENE_NAME: "${CM_SCENE_NAME:-CM_Scene}"
      BURARI_SCENE_NAME: "${BURARI_SCENE_NAME:-Burari_Scene}"
      CONTROLLER_ADDRESS: "${CONTROLLER_ADDRESS:-http://localhost:5173,http://127.0.0.1:5173}"
      SCENE_BACKUP_PATH: "${SCENE_BACKUP_PATH:-/app/data/scene.json}"
    volumes:
      - ./server-data:/app/data

  client:
    image: ghcr.io/sohosai/ultradonguri-controller:production
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      TZ: "${TZ:-Asia/Tokyo}"
      # ミュート用。ブラウザから見た OBS WebSocket の接続先
      OBS_WEBSOCKET_URL: "${OBS_WEBSOCKET_URL:-ws://localhost:4455}"
      # server と同じ OBS WebSocket のパスワードを使う
      OBS_WEBSOCKET_PASSWORD: "${PASSWORD:?PASSWORD is required}"
    volumes:
      - ${PERFORMANCES_FILE:-./performances.sample.json}:/app/dist/performances.json:ro
      - ./videos:/app/videos
